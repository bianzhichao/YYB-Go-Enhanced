<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商户本地账单</title><style>body{max-width:1100px;margin:2rem auto;padding:0 1rem;font:16px system-ui;color:#243246}input,button{padding:.5rem;margin:.2rem}table{width:100%;border-collapse:collapse}td,th{padding:.7rem;text-align:left;border-bottom:1px solid #ddd}pre{white-space:pre-wrap}fieldset{margin:1rem 0}small{color:#536273}</style></head>
<body><a href="/">返回账号管理</a><h1>商户本地账单</h1><p>记录和手工维护账单状态。标记完成不会查询或执行支付结算。普通用户只可查看自己账号的账单，写入和清理需要管理员权限。</p>
<form id="filter"><input name="openid" placeholder="openid"><input name="nickname" placeholder="昵称"><button>查询</button></form>
<fieldset><legend>管理员新增账单</legend><form id="insert"><input name="openid" placeholder="openid"><input name="nickname" placeholder="昵称"><input name="orderNo" placeholder="订单号"><input name="desc" placeholder="描述"><input name="mchId" placeholder="mchId" required><input name="appid" placeholder="appid" required><input name="package" placeholder="package" required><button>保存</button></form></fieldset>
<button id="cleanup">清理已标记 done / fail 的本地记录</button><pre id="message" role="status"></pre><table><thead><tr><th>ID / 订单</th><th>账号</th><th>描述</th><th>创建时间</th><th>本地状态</th><th>管理员操作</th></tr></thead><tbody id="rows"></tbody></table>
<script>
'use strict';const msg=document.getElementById('message');
async function api(path,body){const r=await fetch(path,{credentials:'same-origin',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const out=await r.json();if(!r.ok||out.code!==0)throw Error(out.msg||'请求失败');return out.data;}
function td(row,text){const cell=document.createElement('td');cell.textContent=text??'';row.append(cell);return cell;}
async function load(){try{const data=await api('/wx/bills?'+new URLSearchParams(new FormData(document.getElementById('filter'))));const rows=document.getElementById('rows');rows.replaceChildren();for(const b of data){const row=document.createElement('tr');td(row,b.id+' / '+b.orderNo);td(row,b.openid+' '+b.nickname);td(row,b.desc);td(row,b.createdAt);td(row,b.status);const cell=td(row,'');for(const [action,label] of [['confirm','手工标记完成'],['fail','标记失败'],['delete','删除']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{if(!confirm(label+'：仅修改本地账单记录？'))return;try{const out=await api('/wx/bills/'+action,{id:b.id});msg.textContent=out.message||'本地记录已更新';await load();}catch(e){msg.textContent=e.message;}};cell.append(btn);}rows.append(row);}}catch(e){msg.textContent=e.message;}}
document.getElementById('filter').onsubmit=e=>{e.preventDefault();load();};document.getElementById('insert').onsubmit=async e=>{e.preventDefault();try{await api('/wx/bills/insert',Object.fromEntries(new FormData(e.target)));msg.textContent='本地账单已保存';await load();}catch(e){msg.textContent=e.message;}};document.getElementById('cleanup').onclick=async()=>{if(!confirm('删除全部 done / fail 本地记录？'))return;try{const out=await api('/wx/bills/cleanup',{});msg.textContent='已清理 '+out.deleted+' 条本地记录';await load();}catch(e){msg.textContent=e.message;}};load();
</script></body></html>
